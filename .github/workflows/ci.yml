name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Deterministic rule-only mode: no API key needed in CI.
      LLM_PROVIDER: rule
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate synthetic evidence
        run: python -m ingest.generate --seed 42 --n 200

      - name: Run tests
        run: python -m pytest

      - name: Run eval harness (smoke)
        run: python -m evals.run

      - name: Run stress test (smoke)
        run: python -m evals.stress
